/* Papel y stickers: hoja cuadriculada, cintas, tarjetas con sombra dura y notas a mano.
   Es un estilo de una sola versión (papel claro), no cambia con el modo oscuro. */
:root {
  --paper: #FFF5F9; --grid: #D8E6F5; --ink: #3A3050; --ink-soft: #5D5278; --line: #9A8FB2; --card: #FFFFFF; --margin: #F4B6CF;
  --lila: #D5C8F5; --rosa: #F9C6DC; --menta: #BFE8D6; --limon: #FBEBA6; --celeste: #BFE0F7; --durazno: #FFD9C2;
  --sh-lila: #B9A3F0; --sh-rosa: #E59BBB; --sh-menta: #8FCFB6; --sh-limon: #E3CC6A; --sh-celeste: #8EC1E8; --sh-durazno: #EDAE87;
  --hand: #8A4F73; --ok: #1F6B4A; --bad: #9B2C4D;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-hand: "Caveat", "Comic Sans MS", cursive;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sec: var(--lila); --sh: var(--sh-lila);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background-color: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px;
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 0 120px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
